<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#451a03">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="卡冊">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>卡冊 V8</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#1d2a3a;--bg2:#15202d;--sheet:#e9edf2;--sleeve:#f8fafc;--line:#b9c3cf;--ink:#16202c;--btn:#f2b84b;--btnink:#2a1c00;--txt:#dfe7f0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sheet:#2b3647;--sleeve:#1f2938;--line:#46556b}}
:root[data-theme="dark"]{--sheet:#2b3647;--sleeve:#1f2938;--line:#46556b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 30%,var(--bg),var(--bg2));color:var(--txt);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;overflow:hidden;user-select:none;-webkit-user-select:none}
h1{font-size:17px;font-weight:600;margin:12px 0 4px;letter-spacing:.12em}
#stage{flex:1;width:100%;display:flex;align-items:center;justify-content:center;touch-action:none;min-height:0}
#book{position:relative;perspective:1800px;width:min(92vw,calc((100dvh - 190px) * .74));aspect-ratio:.74;max-width:520px}
.page,.face{position:absolute;inset:0;background:var(--sheet);border-radius:4px 10px 10px 4px;box-shadow:0 10px 30px rgba(0,0,0,.45);border-left:7px solid var(--spine,#0d1520)}
.page{padding:3.5% 3.5% 3.5% 5%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:2.6%}
.face .page{box-shadow:none;border:0;border-radius:inherit}
.slot{position:relative;border-radius:5px;background:var(--sleeve);border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--line);font-size:22px}
.slot img{width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.slot.has{background:transparent;border-color:transparent;box-shadow:none}
.slot.lift{opacity:.25}
.slot.over{outline:3px solid var(--btn);outline-offset:-3px}
.leaf{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;z-index:5}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg);background:linear-gradient(90deg,#aab4c1,var(--sheet) 30%)}
#ghost{position:fixed;z-index:50;pointer-events:none;border-radius:6px;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.55);transform:scale(1.1) rotate(3deg)}
#ghost img{width:100%;height:100%;object-fit:contain}
#bar{display:flex;align-items:center;gap:10px;padding:10px 0 14px}
#bar button{border:0;border-radius:22px;height:44px;min-width:44px;font:inherit;font-size:15px;cursor:pointer;background:#314257;color:var(--txt)}
#bar button:focus-visible{outline:3px solid var(--btn);outline-offset:2px}
#bar #add{display:inline-flex;align-items:center;justify-content:center;min-width:44px;border-radius:22px;height:44px;font-size:15px;cursor:pointer;background:var(--btn);color:var(--btnink);padding:0 14px;font-weight:600}
#pg{min-width:76px;text-align:center;font-size:14px}
#lb{position:fixed;inset:0;background:rgba(5,10,16,.85);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:60}
#lb.on{display:flex}
#lb img{max-width:86vw;max-height:70dvh;border-radius:10px}
#lb div{display:flex;gap:12px}
#lb button{border:0;border-radius:22px;height:44px;padding:0 20px;font:inherit;background:#314257;color:var(--txt)}
#lb .del{background:#d9534f;color:#fff}
#saveStatus{font-size:11px;opacity:.7;min-width:42px;text-align:center}
#searchBtn{position:relative}
#searchPanel{position:fixed;inset:0;background:rgba(5,10,16,.82);display:none;align-items:flex-end;justify-content:center;z-index:75}
#searchPanel.on{display:flex}
#searchBox{width:min(100%,560px);max-height:88dvh;overflow:auto;background:#222f40;color:#e6edf5;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
#searchBox h2{font-size:16px;margin:0 0 12px}
#searchInput{width:100%;height:46px;border-radius:12px;border:1px solid #4a5b73;background:#17212e;color:#fff;font:inherit;padding:0 14px}
#searchResults{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;max-height:55dvh;overflow:auto}
.sr{border:1px solid #46556b;background:#1b2736;border-radius:10px;padding:5px;color:#fff;text-align:left;font:inherit;cursor:pointer}
.sr img{width:100%;aspect-ratio:.7;object-fit:contain;border-radius:6px;background:#111827}.sr small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}
#cardEdit{position:fixed;inset:0;background:rgba(5,10,16,.86);display:none;align-items:center;justify-content:center;z-index:80;padding:18px}
#cardEdit.on{display:flex}
#cardEditBox{width:min(100%,480px);max-height:90dvh;overflow:auto;background:#222f40;border-radius:18px;padding:16px;color:#e6edf5}
#cardEditBox img{display:block;width:min(180px,45vw);max-height:240px;object-fit:contain;margin:0 auto 12px;border-radius:8px;background:#111827}
#cardEditBox label{display:block;font-size:13px;margin:10px 0 5px}#cardEditBox input,#cardEditBox textarea{width:100%;border-radius:10px;border:1px solid #4a5b73;background:#17212e;color:#fff;font:inherit;padding:10px}#cardEditBox textarea{min-height:80px;resize:vertical}
#cardEditBox .row{display:flex;gap:8px;margin-top:14px}
#toast{position:fixed;bottom:90px;background:#000c;color:#fff;padding:8px 14px;border-radius:16px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:70}
#toast.on{opacity:1}
h1{text-shadow:0 1px 6px #0008;max-width:70vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#set{position:fixed;inset:0;background:rgba(5,10,16,.6);display:none;align-items:flex-end;justify-content:center;z-index:65}
#set.on{display:flex}
#sp{width:min(100%,520px);max-height:84dvh;overflow:auto;background:#222f40;color:#e6edf5;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
#sp h2{font-size:15px;margin:16px 0 8px;font-weight:600}
#sp h2:first-child{margin-top:0}
#sp input[type=text]{width:100%;height:44px;border-radius:10px;border:1px solid #4a5b73;background:#17212e;color:#fff;font:inherit;padding:0 12px}
.sw{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sw button{width:44px;height:44px;border-radius:12px;border:2px solid transparent;cursor:pointer;padding:0}
.sw button.sel{border-color:var(--btn)}
.sw input[type=color]{width:44px;height:44px;border:0;border-radius:12px;padding:0;background:none}
#sp .row{display:flex;gap:10px;margin-top:18px}
#sp .row button,.sw .pill{height:44px;border-radius:22px;border:0;padding:0 16px;font:inherit;background:#38495f;color:#fff;cursor:pointer}
#sp .row .ok{background:var(--btn);color:var(--btnink);font-weight:600;flex:1}
.cover{display:flex!important;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;background-color:var(--cover)!important;border-left:7px solid var(--spine)!important;border-radius:4px 14px 14px 4px;color:var(--covtxt);padding:12%;cursor:pointer;overflow:hidden}
.cover::before{content:"";position:absolute;inset:4.5%;border:2px dashed var(--covtxt);opacity:.45;border-radius:4px 10px 10px 4px;pointer-events:none}
.cover b{font-size:clamp(22px,7vw,36px);letter-spacing:.14em;font-weight:700;line-height:1.35;word-break:break-all}
.cover i{font-style:normal;font-size:13px;opacity:.75;letter-spacing:.08em}
.cover hr{width:46%;border:0;border-top:2px solid var(--covtxt);opacity:.55;margin:0}
.opt{display:flex;align-items:center;gap:12px;width:100%;height:50px;border-radius:12px;border:2px solid transparent;background:#2c3b50;color:#e6edf5;font:inherit;text-align:left;padding:0 10px;cursor:pointer;margin-bottom:8px}
.opt.sel{border-color:var(--btn)}
.opt s{flex:none;width:30px;height:30px;border-radius:8px;border:1px solid #fff5;text-decoration:none}
.opt span{display:flex;flex-direction:column;line-height:1.25;font-size:14px}
.opt small{font-size:11.5px;opacity:.75;font-variant-numeric:tabular-nums}
.face .page.L{border:0;border-radius:inherit}
.page.L{padding:3.5% 5% 3.5% 3.5%;border-left:0;border-right:7px solid var(--spine,#0d1520);border-radius:10px 4px 4px 10px}
.face.back.L{border-left:0;border-right:7px solid var(--spine,#0d1520);border-radius:10px 4px 4px 10px;background:var(--sheet)}
#book{transition:transform .8s cubic-bezier(.5,.05,.3,1)}
@media (orientation:landscape) and (min-width:640px){
#book{width:min(94vw,calc((100dvh - 128px) * 1.48));aspect-ratio:1.48;max-width:1040px;perspective:2800px}
h1{margin:6px 0 0}#bar{padding:4px 0 8px}}
.cover.cv1::before{border:4px double var(--covtxt);opacity:.8}
.cover.cv2::before{display:none}
.cover.cv3{background-image:radial-gradient(circle at 20% 22%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 72% 14%,#fff 0 1px,transparent 2px),radial-gradient(circle at 86% 66%,#fff 0 1.6px,transparent 2.5px),radial-gradient(circle at 28% 82%,#fff 0 1px,transparent 2px),radial-gradient(circle at 56% 48%,#fff 0 1px,transparent 2px),radial-gradient(circle at 10% 55%,#fff 0 1px,transparent 2px)}
.cover.cv4{background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.08) 0 12px,transparent 12px 24px),repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 12px,transparent 12px 24px)}
.cover.cv5{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.09) 0 10px,transparent 10px 20px)}
.cover.cv6{background-image:linear-gradient(90deg,rgba(0,0,0,.25) 0 16%,transparent 16%)}
.cover.cv6::before{inset:4.5% 4.5% 4.5% 21%}
.cvw{position:relative;width:100%;aspect-ratio:.74}
.cover.mini{padding:8%;gap:5px;cursor:pointer}
.cover.mini b{font-size:13px;letter-spacing:.06em}
.cover.mini hr{display:none}
.cover.mini:not(.tile) i{display:none}
.cover.mini i{font-size:11px}
.cvb{width:64px;border:2px solid transparent;border-radius:8px;background:none;padding:2px;color:#e6edf5;font:inherit;font-size:11px;cursor:pointer;text-align:center}
.cvb.sel{border-color:var(--btn)}
.gb{width:44px;height:44px;border-radius:10px;border:2px solid transparent;background:#2c3b50;color:#e6edf5;font:inherit;font-size:16px;cursor:pointer}
.gb.sel{border-color:var(--btn);background:#3a4d66}
#shelf{position:fixed;inset:0;background:rgba(5,10,16,.8);display:none;align-items:center;justify-content:center;z-index:64}
#shelf.on{display:flex}
#shp{width:min(100%,720px);max-height:90dvh;overflow:auto;background:#222f40;color:#e6edf5;border-radius:18px;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
#shp h2{font-size:15px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
#shp h2 button{height:36px;border:0;border-radius:18px;padding:0 14px;background:#38495f;color:#fff;font:inherit;cursor:pointer}
#shbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.tile{border:3px solid transparent;border-radius:12px;background:none;padding:3px;cursor:pointer}
.tile.sel{border-color:var(--btn)}
.tile.new{aspect-ratio:.74;background:#2c3b50;color:#e6edf5;font:inherit;font-size:14px;display:flex;align-items:center;justify-content:center;text-align:center}
#sp .row #bkdel{background:#6b2b2b}
:root{--pw:190px}
@media (orientation:portrait),(max-width:639px){:root{--pw:58px}.cp .opt span{display:none}.cp .opt{justify-content:center;padding:0!important}.cp h3{font-size:10px}.cp label.opt s{display:none}.cp label.opt input{margin:0!important;width:100%!important}}
#cpick{position:fixed;inset:0;display:none;pointer-events:none;z-index:62}
#cpick.on{display:block}
.cp{position:absolute;top:0;bottom:0;overflow:auto;background:rgba(34,47,64,.93);padding:calc(8px + env(safe-area-inset-top,0px)) 6px 10px;pointer-events:auto}
#cl{left:0;width:calc(var(--pw) + env(safe-area-inset-left,0px));padding-left:calc(6px + env(safe-area-inset-left,0px))}
#cr{right:0;width:calc(var(--pw) + env(safe-area-inset-right,0px));padding-right:calc(6px + env(safe-area-inset-right,0px))}
.cp h3{font-size:12px;margin:0 0 6px;text-align:center;color:#e6edf5;opacity:.85}
.cp .opt{height:40px;margin-bottom:6px;gap:6px;padding:0 6px;font-size:12px}
.cp .opt span{font-size:12px}.cp .opt small{display:none}
#ctop{position:fixed;top:calc(env(safe-area-inset-top,0px) + 4px);left:50%;transform:translateX(-50%);max-width:calc(100vw - 2*var(--pw) - 8px);display:flex;gap:8px;align-items:center;pointer-events:auto;background:rgba(34,47,64,.93);color:#e6edf5;border-radius:18px;padding:4px 6px 4px 12px;font-size:11px;line-height:1.35}
#ctop button{height:32px;border:0;border-radius:16px;padding:0 12px;background:var(--btn);color:var(--btnink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;flex:none}
body.picking #stage{padding:50px calc(var(--pw) + env(safe-area-inset-right,0px)) 0 calc(var(--pw) + env(safe-area-inset-left,0px))}
#cpbtn{height:44px;border:0;border-radius:22px;padding:0 16px;font:inherit;background:#38495f;color:#fff;cursor:pointer;width:100%}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0}

#bar{flex-wrap:wrap;justify-content:center;row-gap:6px;max-width:100%}
.sel8{height:38px;border-radius:8px;background:#17212e;color:#fff;border:1px solid #4a5b73;padding:0 8px;font:inherit;margin:4px 4px 4px 0}
.qb{position:absolute;right:3px;bottom:3px;background:#000b;color:#fff;font-size:11px;padding:1px 6px;border-radius:9px}
.fv{position:absolute;left:3px;top:3px;font-size:12px}
#pg{cursor:pointer}
#cardEditBox .row button{flex:none;height:44px;min-width:44px;border:0;border-radius:22px;background:#38495f;color:#fff;font:inherit}
#cardEditBox .chk{display:inline-flex;margin:4px 12px 4px 0}#cardEditBox .chk input{width:auto}
#dash .dg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
#dash .dg div{background:#2c3b50;border-radius:10px;padding:8px 4px;text-align:center}
#dash .dg b{display:block;font-size:18px}#dash .dg span{font-size:11px;opacity:.8}
#dash .bar{height:10px;border-radius:5px;background:#17212e;overflow:hidden;margin:4px 0 10px}#dash .bar i{display:block;height:100%;background:var(--btn)}
#dash .tl{font-size:12px;margin:6px 0}#dash .tl b{margin-right:6px}#dash .tl span{display:inline-block;background:#2c3b50;border-radius:10px;padding:2px 8px;margin:2px 4px 2px 0}
#sfil{margin-top:8px}#sfil label{font-size:13px;margin-right:10px;display:inline-block}
body.imm #bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 6px);background:rgba(20,30,44,.9);border-radius:28px;padding:6px 10px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:40;max-width:96vw}
body.imm.ui #bar{opacity:1;pointer-events:auto}
@media (orientation:landscape) and (min-width:640px){body.imm #book{width:min(96vw,calc((100dvh - 24px) * 1.48))}}
</style>
</head>
<body>
<div id="stage"><div id="book"></div></div>
<div id="bar">
  <button id="shbtn" aria-label="書櫃">📚</button>
  <button id="searchBtn" aria-label="搜尋卡片">🔎</button>
  <button id="prev" aria-label="上一頁">‹</button>
  <span id="pg"></span><span id="saveStatus">已保存</span>
  <button id="next" aria-label="下一頁">›</button>
  <label id="add" for="file" role="button" tabindex="0">📷</label>
  <button id="undo" aria-label="復原" disabled>↶</button>
  <button id="redo" aria-label="重做" disabled>↷</button>
  <button id="fsbtn" aria-label="全螢幕">⛶</button><button id="gear" aria-label="自訂">⚙️</button>
</div>
<input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" multiple style="position:fixed;left:-9999px;opacity:0;width:1px;height:1px">
<div id="ghost" hidden></div>
<div id="lb"><img id="lbimg" alt=""><div><button id="lbclose">關閉</button><button id="lbedit">編輯資料</button><button class="del" id="lbdel">移除卡片</button></div></div>
<div id="set"><div id="sp">
<h2>書名</h2><input type="text" id="ntitle" maxlength="20">
<h2>每頁格數(1–9,或 30 = 6×5)</h2><div class="sw" id="grsw"></div>
<h2>封面樣式</h2><div class="sw" id="cvsw"></div>
<h2>顏色</h2><button id="cpbtn">🎨 調整背景與內頁色(左右即時預覽)</button>
<h2>卡片與音效</h2>
<label style="font-size:13px">圖片品質 <select id="imgQuality" style="height:38px;margin-left:8px;border-radius:8px;background:#17212e;color:#fff;border:1px solid #4a5b73;padding:0 8px"><option value="480">省空間 480px</option><option value="640">平衡 640px</option><option value="800">高畫質 800px</option><option value="1200">超高畫質 1200px</option></select></label>
<label class="chk"><input type="checkbox" id="dbk"> 加入時自動去除黑角</label><label class="chk"><input type="checkbox" id="dwh"> 加入時自動去除白角</label><label style="font-size:13px;display:block">黑角敏感度 <input type="range" id="bsn" min="20" max="120" style="width:100%"></label><label style="font-size:13px;display:block">白角敏感度 <input type="range" id="wsn" min="5" max="55" style="width:100%"></label><label style="font-size:13px;display:block">最大處理深度(佔圖片短邊 %) <input type="range" id="dep" min="5" max="30" style="width:100%"></label><div class="row"><button id="pvbtn">選圖預覽處理前／後</button></div><div id="pvbox" style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"></div><input id="pvfile" type="file" accept="image/*" style="position:fixed;left:-9999px;opacity:0;width:1px;height:1px"><label style="font-size:13px;display:block;margin-top:10px">此冊目標總張數(選填,用於完成度) <input type="number" id="btotal" min="0" class="sel8" style="width:100px"></label>
<label class="chk"><input type="checkbox" id="snd"> 翻頁聲</label>
<div class="row"><button id="rdb">套用角落去除到此冊</button><button id="bgreset">還原顏色</button><button id="bkdel">刪除此書</button><button class="ok" id="setok">完成</button></div>
<h2>頁面</h2><div class="row"><button id="pgadd">新增空白頁</button><button id="pgdup">複製此頁</button><button id="pgdel">刪除此頁</button></div><div class="row"><select id="sortBy" class="sel8"><option value="number">卡號</option><option value="name">名稱</option><option value="set">系列</option><option value="rarity">稀有度</option><option value="createdAt">加入時間</option></select><button id="pgsort">整理本頁</button><button id="pgfill">填滿空格</button></div>
<h2>書本與備份</h2><div class="row"><button id="bkdup">複製此書</button><button id="bkexp">匯出備份</button><button id="bkimp">匯入備份</button></div>
<h2>關於</h2><div style="font-size:12px;opacity:.7">Card Binder V8・資料保存於本機 IndexedDB・點頁碼可快速跳頁</div><input id="bkfile" type="file" accept="application/json,.json" style="position:fixed;left:-9999px;opacity:0;width:1px;height:1px">
</div></div>
<div id="cpick"><div id="cl" class="cp"><h3>背景色</h3><div id="bgsw"></div></div><div id="cr" class="cp"><h3>內頁色</h3><div id="shsw"></div></div><div id="ctop"><span id="cap"></span><button id="cdone">完成</button></div></div>
<div id="shelf"><div id="shp"><h2><span id="shn">我的書櫃</span><button id="shx">關閉</button></h2><div id="dash"></div><select id="shsel" class="sel8"><option value="def">依建立順序</option><option value="name">依名稱</option><option value="count">依卡片數</option><option value="pct">依完成度</option></select><div id="shbox"></div></div></div>

<div id="toast"></div>
<script>
const KEY='cardbinder:v1';
let S=null,SH=null;
const $=id=>document.getElementById(id);
const book=$('book'),stage=$('stage');
let busy=false,tt;
/* storage: IndexedDB (meta + one blob per card). S.pages holds object URLs at runtime. */
const DB=new Promise((res,rej)=>{try{const r=indexedDB.open('cardbinder',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
DB.catch(()=>{});
const tx=(mode,fn)=>DB.then(db=>new Promise((res,rej)=>{const t=db.transaction('kv',mode),rq=fn(t.objectStore('kv'));t.oncomplete=()=>res(rq&&rq.result);t.onerror=t.onabort=()=>rej(t.error)}));
const idbGet=k=>tx('readonly',st=>st.get(k)),idbPut=(k,v)=>tx('readwrite',st=>st.put(v,k)),idbKeys=()=>tx('readonly',st=>st.getAllKeys());
const urlId=new Map();let saveT,chain=Promise.resolve(),warned=false,ready=false;
const H={u:[],r:[]}; const BH={};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
async function storeBlob(b){const id=uid();await idbPut('img:'+id,b);const u=URL.createObjectURL(b);urlId.set(u,id);return u}
async function doPersist(){
  if(!ready||!SH)return;
  try{$('saveStatus').textContent='儲存中…';
    const used=new Set(),books=SH.books.map(b=>({cur:b.cur,cfg:b.cfg,cards:b.cards||{},pages:b.pages.map(pg=>pg.map(u=>{const id=u&&urlId.get(u);if(id){used.add(id);return id}return u&&/^https?:/.test(u)?u:null}))}));
    H.u.concat(H.r).forEach(x=>x.p.forEach(pg=>pg.forEach(u=>{const id=u&&urlId.get(u);if(id)used.add(id)})));
    await idbPut('meta',{v:3,books:books,act:SH.act});
    const ks=await idbKeys(),dead=ks.filter(k=>typeof k==='string'&&k.startsWith('img:')&&!used.has(k.slice(4)));
    if(dead.length)await tx('readwrite',st=>{dead.forEach(k=>st.delete(k))});
    for(const[u,id]of[...urlId])if(!used.has(id)){URL.revokeObjectURL(u);urlId.delete(u)}
    $('saveStatus').textContent='已保存';
  }catch(e){$('saveStatus').textContent='儲存失敗';if(!warned){warned=true;toast('無法保存,請確認瀏覽器儲存空間')}}
}
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{chain=chain.then(doPersist)},120)}
function flush(){clearTimeout(saveT);chain=chain.then(doPersist)}
addEventListener('pagehide',flush);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
const dataToBlob=d=>{const[h,b]=d.split(','),bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:(h.match(/:(.*?);/)||[])[1]||'image/jpeg'})};
function normBook(b){
  const c=Object.assign({},DEF,b.cfg||{});
  if(!((c.grid>=1&&c.grid<=9)||c.grid===30))c.grid=9;
  if(typeof c.bg!=='number'||c.bg>=BGS.length||(c.bg<0&&!c.bgc))c.bg=0;
  if(typeof c.sh!=='number'||c.sh>=SHS.length||(c.sh<0&&!c.shc))c.sh=0;
  if(typeof c.cv!=='number'||c.cv<0||c.cv>=CVS.length)c.cv=0;
  const pages=(b.pages&&b.pages.length?b.pages:[[]]).map(pg=>Array.from({length:c.grid},(_,i)=>pg[i]||null));
  c.quality=[480,640,800,1200].includes(+c.quality)?+c.quality:640;
  const cards={};for(const k in (b.cards||{}))cards[k]=normCard(b.cards[k]);
  return{cur:Math.min(typeof b.cur==='number'?b.cur:-1,pages.length-1),cfg:c,pages:pages,cards:cards};
}
async function loadAll(){
  const meta=await idbGet('meta');
  let raw=null;
  if(meta&&meta.books&&meta.books.length)raw=meta;
  else if(meta&&Array.isArray(meta.pages)&&meta.pages.length)raw={books:[meta],act:0};
  if(raw){
    const ids=new Set(raw.books.flatMap(b=>b.pages.flat()).filter(x=>x&&!/^https?:/.test(x))),um=new Map();
    await Promise.all([...ids].map(async id=>{const b=await idbGet('img:'+id);if(b){const u=URL.createObjectURL(b);urlId.set(u,id);um.set(id,u)}}));
    SH={books:raw.books.map(b=>normBook({cur:b.cur,cfg:b.cfg,cards:b.cards,pages:b.pages.map(pg=>pg.map(x=>(x&&(/^https?:/.test(x)?x:um.get(x)))||null))})),act:Math.min(raw.act||0,raw.books.length-1)};
    return;
  }
  let old=null;try{old=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(old&&Array.isArray(old.pages)&&old.pages.length){
    const pages=[];
    for(const pg of old.pages){const row=[];for(let i=0;i<9;i++){const d=pg[i];row.push(d?await storeBlob(dataToBlob(d)):null)}pages.push(row)}
    SH={books:[normBook({pages:pages,cur:old.cur,cfg:old.cfg})],act:0};
    ready=true;await doPersist();try{localStorage.removeItem(KEY)}catch(e){}
  }
}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}
function coverEl(b,mini){
  b=b||S;const c=document.createElement('div');c.className='page cover cv'+b.cfg.cv+(mini?' mini tile':'');
  const v=vars(b.cfg);c.style.setProperty('--cover',v['--cover']);c.style.setProperty('--covtxt',v['--covtxt']);
  const n=b.pages.reduce((a,pg)=>a+pg.filter(Boolean).length,0);
  c.innerHTML='<hr><b></b><hr><i>'+(mini?n+' 張':'共 '+n+' 張卡片・輕點或滑動翻開')+'</i>';
  c.querySelector('b').textContent=b.cfg.title||'我的卡冊';
  return c;
}
function pageEl(i,side){
  if(i<0)return coverEl();
  const p=document.createElement('div');p.className='page'+(side==='l'?' L':'');
  const[cols,rows]=GR[S.cfg.grid];p.style.gridTemplate='repeat('+rows+',1fr)/repeat('+cols+',1fr)';
  S.pages[i].forEach((c,k)=>{
    const s=document.createElement('div');s.className='slot'+(c?' has':'');s.dataset.i=k;s.dataset.p=i;
    if(c){const im=new Image();im.dataset.card=c;im.src=c;im.draggable=false;im.onerror=()=>{im.remove();s.textContent='⚠'};s.append(im);const cm=cardMeta(c);if(cm.quantity>1){const bd=document.createElement('span');bd.className='qb';bd.textContent='×'+cm.quantity;s.append(bd)}if(cm.favorite){const fv=document.createElement('span');fv.className='fv';fv.textContent='⭐';s.append(fv)}}else s.textContent='+';
    p.append(s);
  });
  return p;
}
const mq=matchMedia('(orientation:landscape) and (min-width:640px)');
const spread=()=>mq.matches;
const blank=()=>Array(S.cfg.grid).fill(null);
function place(el,side){el.style.inset=side==='l'?'0 50% 0 0':'0 0 0 50%';return el}
function label(c){
  if(c<0)return '封面';
  if(!spread())return '第 '+(c+1)+' / '+S.pages.length+' 頁';
  const l=c&~1;return '第 '+(l+1)+'–'+(l+2)+' 頁';
}
function st(c){if(c<0)return{l:null,r:'cover'};const l=c&~1;return{l:l,r:l+1}}
function el(v,side){if(v===null)return null;if(v==='cover')return coverEl();return pageEl(v,side)}
function fit(){
  const cs=getComputedStyle(stage),px=k=>parseFloat(cs[k])||0,sw=stage.clientWidth-px('paddingLeft')-px('paddingRight'),sh=stage.clientHeight-px('paddingTop')-px('paddingBottom')-8,ar=spread()?1.48:.74;
  book.style.width=Math.max(120,Math.min(sw-12,sh*ar))+'px';book.style.aspectRatio=ar;book.style.maxWidth='none';
}
function render(){
  fit();book.innerHTML='';
  if(spread()){
    if(S.cur<0){book.append(place(coverEl(),'r'));book.style.transform='translateX(-25%)'}
    else{
      const l=S.cur&~1;while(S.pages.length<l+2)S.pages.push(blank());
      book.append(place(pageEl(l,'l'),'l'),place(pageEl(l+1,'r'),'r'));book.style.transform='none';
    }
  }else{book.style.transform='none';book.append(pageEl(S.cur))}
  $('pg').textContent=label(S.cur);
}
const flip=d=>spread()?flipSpread(d):flipOne(d);
async function flipSpread(dir){
  if(busy)return;
  const old=S.cur;let t;
  if(dir>0){
    if(old<0)t=0;
    else{const l=old&~1;t=l+2;
      if(t>=S.pages.length&&!(S.pages[l].some(Boolean)||(S.pages[l+1]||[]).some(Boolean)))return;
      while(S.pages.length<t+2)S.pages.push(blank())}
  }else{if(old<0)return;const l=old&~1;t=l===0?-1:l-2}
  busy=true;S.cur=t;save();flipSound();$('pg').textContent=label(t);
  const X=st(dir>0?old:t),Y=st(dir>0?t:old);
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  book.innerHTML='';
  const bl=el(X.l,'l'),br=el(Y.r,'r');
  if(bl)book.append(place(bl,'l'));if(br)book.append(place(br,'r'));
  const leaf=document.createElement('div');leaf.className='leaf';leaf.style.inset='0 0 0 50%';
  const front=document.createElement('div');front.className='face';
  const back=document.createElement('div');back.className='face back L';
  front.append(el(X.r,'r'));back.append(el(Y.l,'l'));
  back.firstChild.classList.add('L');
  leaf.append(front,back);book.append(leaf);
  book.style.transform=t<0?'translateX(-25%)':'none';
  const fr=dir>0?[{transform:'rotateY(0deg)'},{transform:'rotateY(-180deg)'}]:[{transform:'rotateY(-180deg)'},{transform:'rotateY(0deg)'}];
  try{await leaf.animate(fr,{duration:reduce?1:800,easing:'cubic-bezier(.5,.05,.3,1)',fill:'forwards'}).finished}catch(e){}
  render();busy=false;
}
async function flipOne(dir){
  if(busy)return;
  const old=S.cur,t=old+dir;
  if(t<-1)return;
  if(t>=S.pages.length){if(!S.pages[old].some(Boolean))return;S.pages.push(blank())}
  busy=true;S.cur=t;save();flipSound();
  $('pg').textContent=label(t);
  const leaf=document.createElement('div');leaf.className='leaf';
  const front=document.createElement('div');front.className='face';
  const back=document.createElement('div');back.className='face back';
  leaf.append(front,back);
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  let frames;
  if(dir>0){
    book.innerHTML='';book.append(pageEl(t));front.append(pageEl(old));
    frames=[{transform:'rotateY(0deg)'},{transform:'rotateY(-180deg)'}];
  }else{
    front.append(pageEl(t));
    frames=[{transform:'rotateY(-180deg)'},{transform:'rotateY(0deg)'}];
  }
  book.append(leaf);
  try{await leaf.animate(frames,{duration:reduce?1:800,easing:'cubic-bezier(.5,.05,.3,1)',fill:'forwards'}).finished}catch(e){}
  render();busy=false;
}
$('next').onclick=()=>flip(1);$('prev').onclick=()=>flip(-1);

/* add photos */
$('add').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click()}};
function shrink(file){return new Promise(res=>{
  const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const m=+S.cfg.quality||640,r=Math.min(1,m/Math.max(im.width,im.height));
    const c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);const cut=(S.cfg.deblack||S.cfg.dewhite)&&cutCorners(c,cutOpts());c.toBlob(b=>{if(!b||b.type==='image/webp'||cut)return res(b);c.toBlob(j=>res(j||b),'image/jpeg',.85)},'image/webp',.85)};
  im.onerror=()=>{URL.revokeObjectURL(u);res(null)};im.src=u});}
$('file').onchange=async e=>{
  const files=[...e.target.files];e.target.value='';if(files.length)mark();
  let n=0;
  for(const f of files){
    if((!/^image\//.test(f.type)&&!/\.(heic|heif)$/i.test(f.name))||f.size>40e6){skipN++;continue}const bl=await shrink(f);if(!bl){skipN++;continue}let d;try{d=await storeBlob(bl)}catch(err){toast('儲存空間不足或無法使用');break}
    let p=Math.max(0,S.cur),k;
    while(true){k=S.pages[p].indexOf(null);if(k>=0)break;p++;if(p>=S.pages.length)S.pages.push(blank())}
    S.pages[p][k]=d; S.cards=S.cards||{}; S.cards[urlId.has(d)?urlId.get(d):d]=normCard({name:f.name.replace(/\.[^.]+$/,'')}); n++;
  }
  save();render();toast(n?('已加入 '+n+' 張卡片'+(skipN?',略過 '+skipN+' 個無法處理的檔案':'')):'沒有可加入的圖片');skipN=0;
};

/* gestures: tap / swipe / long-press drag */
let g=null,openPick=false;
stage.addEventListener('click',()=>{if(openPick){openPick=false;$('file').click()}});
const slotAt=(x,y)=>{const el=document.elementFromPoint(x,y);return el&&el.closest('.slot')};
stage.addEventListener('pointerdown',e=>{
  if(busy)return;
  const s=e.target.closest('.slot');
  g={x:e.clientX,y:e.clientY,s,p:s?+s.dataset.p:S.cur,idx:s?+s.dataset.i:-1,drag:false,moved:false,timer:null};
  if(s&&S.pages[g.p][g.idx]){
    g.timer=setTimeout(()=>{
      g.drag=true;s.classList.add('lift');navigator.vibrate&&navigator.vibrate(15);
      const r=s.getBoundingClientRect(),gh=$('ghost');
      gh.hidden=false;gh.style.width=r.width+'px';gh.style.height=r.height+'px';
      gh.innerHTML='';const im=new Image();im.src=S.pages[g.p][g.idx];gh.append(im);
      mv(g.x,g.y);
    },380);
  }
  try{stage.setPointerCapture(e.pointerId)}catch(_){}
});
function mv(x,y){const gh=$('ghost');gh.style.left=(x-gh.offsetWidth/2)+'px';gh.style.top=(y-gh.offsetHeight/2)+'px';
  document.querySelectorAll('.slot.over').forEach(o=>o.classList.remove('over'));
  const t=slotAt(x,y);if(t&&t!==g.s)t.classList.add('over')}
stage.addEventListener('pointermove',e=>{
  if(!g)return;
  if(g.drag){mv(e.clientX,e.clientY);return}
  if(Math.hypot(e.clientX-g.x,e.clientY-g.y)>10){g.moved=true;clearTimeout(g.timer)}
});
function endDrag(){$('ghost').hidden=true;document.querySelectorAll('.slot.over,.slot.lift').forEach(o=>o.classList.remove('over','lift'))}
stage.addEventListener('pointerup',e=>{
  if(!g)return;clearTimeout(g.timer);
  const dx=e.clientX-g.x,dy=e.clientY-g.y,cur=g;g=null;
  if(cur.drag){
    const t=slotAt(e.clientX,e.clientY);endDrag();
    if(t&&t!==cur.s){mark();const a=S.pages[cur.p],b=S.pages[+t.dataset.p],j=+t.dataset.i;[a[cur.idx],b[j]]=[b[j],a[cur.idx]];save()}
    render();return;
  }
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){flip(dx<0?1:-1);return}
  if(S.cur<0&&!cur.moved){flip(1);return}
  if(imm&&!cur.moved){const now=Date.now();if(now-lastTap<320&&cur.s&&S.pages[cur.p][cur.idx]){clearTimeout(tapT);lastTap=0;lbIdx=cur.idx;lbP=cur.p;$('lbimg').src=S.pages[cur.p][cur.idx];$('lb').classList.add('on')}else{lastTap=now;clearTimeout(tapT);tapT=setTimeout(()=>document.body.classList.toggle('ui'),330)}return}
  if(!cur.moved&&cur.s){
    if(S.pages[cur.p][cur.idx]){lbIdx=cur.idx;lbP=cur.p;$('lbimg').src=S.pages[cur.p][cur.idx];$('lb').classList.add('on')}
    else openPick=true;
  }
});
stage.addEventListener('pointercancel',()=>{if(g){clearTimeout(g.timer);if(g.drag){endDrag();render()}g=null}});
stage.addEventListener('contextmenu',e=>e.preventDefault());

/* lightbox */
let lbIdx=-1,lbP=0;
$('lbclose').onclick=()=>$('lb').classList.remove('on');$('lbedit').onclick=()=>{const u=S.pages[lbP][lbIdx];$('lb').classList.remove('on');openCardEditor(u)};
$('lbdel').onclick=()=>{if(!confirm('移除這張卡片?(可用復原找回)'))return;mark();const old=S.pages[lbP][lbIdx],id=urlId.get(old);if(id&&S.cards)delete S.cards[id];S.pages[lbP][lbIdx]=null;save();render();$('lb').classList.remove('on')};
document.addEventListener('keydown',e=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName||'')||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key,open=document.querySelector('#lb.on,#set.on,#shelf.on,#searchPanel.on,#cardEdit.on');
  if(k==='Escape'){if(imm&&!document.fullscreenElement)setImm(false);return}
  if(open)return;
  if(k==='ArrowRight'||k===' '){e.preventDefault();flip(1)}else if(k==='ArrowLeft')flip(-1);
  else if(k==='f'||k==='F')toggleFs();else if(k==='s'||k==='S'){e.preventDefault();$('searchBtn').click()}
  else if(k==='g'||k==='G')$('shbtn').click();else if(k==='z'||k==='Z')$(e.shiftKey?'redo':'undo').click();
});

/* corner cleanup + sound */
function cutOpts(){return{black:!!S.cfg.deblack,white:!!S.cfg.dewhite,bs:+S.cfg.bsens||60,ws:255-(+S.cfg.wsens||20),depth:(+S.cfg.depth||14)/100}}
function cutCorners(c,o){
  o=Object.assign({black:true,white:false,bs:60,ws:235,depth:.14},o||{});
  const w=c.width,h=c.height,ctx=c.getContext('2d'),im=ctx.getImageData(0,0,w,h),d=im.data,seen=new Uint8Array(w*h),lim=Math.round(Math.min(w,h)*o.depth);
  const L=i=>d[i]*.299+d[i+1]*.587+d[i+2]*.114;
  const isB=i=>o.black&&d[i+3]>200&&L(i)<o.bs,isW=i=>o.white&&d[i+3]>200&&L(i)>o.ws;
  let changed=false;
  [[0,0],[w-1,0],[0,h-1],[w-1,h-1]].forEach(([sx,sy])=>{
    const t=isB((sy*w+sx)*4)?isB:isW((sy*w+sx)*4)?isW:null;if(!t)return;
    const stk=[[sx,sy]];seen[sy*w+sx]=1;
    while(stk.length){const[x,y]=stk.pop();d[(y*w+x)*4+3]=0;changed=true;
      for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;
        if(nx<0||ny<0||nx>=w||ny>=h)continue;
        const k=ny*w+nx;if(seen[k]||Math.min(nx,w-1-nx)>lim||Math.min(ny,h-1-ny)>lim)continue;
        if(t(k*4)){seen[k]=1;stk.push([nx,ny])}}}
  });
  if(!changed)return false;
  const al=new Uint8Array(w*h);for(let k=0;k<w*h;k++)al[k]=d[k*4+3]===0?1:0;
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const k=y*w+x;if(al[k])continue;
    if(al[k-1]||al[k+1]||al[k-w]||al[k+w]){const i=k*4,l=L(i);if((o.black&&l<o.bs+35)||(o.white&&l>o.ws-35))d[i+3]=0}}
  ctx.putImageData(im,0,0);return true;

async function reprocess(){

$('pg').onclick=()=>{const n=parseInt(prompt('跳到第幾頁?(1–'+S.pages.length+')',curP()+1),10);if(n>=1&&n<=S.pages.length){S.cur=n-1;save();render()}};
$('pgsort').onclick=()=>{const key=$('sortBy').value,i=curP();mark();
  const it=S.pages[i].filter(Boolean).map(u=>({u,v:cardMeta(u)[key]}));
  it.sort((a,b)=>String(a.v==null?'':a.v).localeCompare(String(b.v==null?'':b.v),'zh-Hant',{numeric:true}));
  S.pages[i]=Array.from({length:S.cfg.grid},(_,k)=>it[k]?it[k].u:null);save();render();toast('已整理本頁')};
$('pgfill').onclick=()=>{const n=S.cfg.grid,cs=S.pages.flat().filter(Boolean);if(!confirm('將全冊 '+cs.length+' 張卡片向前填滿空格(可復原)。繼續?'))return;mark();
  S.pages=[];for(let i=0;i<cs.length;i+=n)S.pages.push(Array.from({length:n},(_,k)=>cs[i+k]||null));if(!S.pages.length)S.pages=[blank()];
  S.cur=Math.min(S.cur,S.pages.length-1);save();render();toast('已填滿空格')};
/* fullscreen / immersive */
function setImm(on){imm=on;document.body.classList.toggle('imm',on);document.body.classList.remove('ui');setTimeout(()=>{if(S)fit()},60)}
async function toggleFs(){
  const el=document.documentElement,fe=document.fullscreenElement||document.webkitFullscreenElement;
  if(fe){try{await(document.exitFullscreen||document.webkitExitFullscreen).call(document)}catch(_){}setImm(false);return}
  if(imm){setImm(false);return}
  setImm(true);const rq=el.requestFullscreen||el.webkitRequestFullscreen;
  if(rq){try{await rq.call(el)}catch(_){toast('此瀏覽器不支援系統全螢幕,已改用沉浸模式')}}else toast('已進入沉浸模式(輕點畫面顯示工具列)');
}
$('fsbtn').onclick=toggleFs;
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&imm)setImm(false)});
document.addEventListener('webkitfullscreenchange',()=>{if(!document.webkitFullscreenElement&&imm)setImm(false)});
/* lightbox pinch zoom */
(()=>{const im=$('lbimg'),pt=new Map();let sc=1,d0=1;im.style.touchAction='none';
  const dist=()=>{const[a,b]=[...pt.values()];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)};
  im.addEventListener('pointerdown',e=>{pt.set(e.pointerId,e);if(pt.size===2)d0=dist()/sc});
  im.addEventListener('pointermove',e=>{if(!pt.has(e.pointerId))return;pt.set(e.pointerId,e);if(pt.size===2){sc=Math.min(5,Math.max(1,dist()/d0));im.style.transform='scale('+sc+')'}});
  ['pointerup','pointercancel'].forEach(t=>im.addEventListener(t,e=>pt.delete(e.pointerId)));
  new MutationObserver(()=>{if(!$('lb').classList.contains('on')){sc=1;im.style.transform='';pt.clear()}}).observe($('lb'),{attributes:true})})();
/* search + filters */
const F={q:'',set:'',rarity:'',language:'',variant:'',condition:'',status:'',fav:false,dup:false,sort:'name',dir:1};
const SORTS=[['name','名稱'],['number','卡號'],['set','系列'],['rarity','稀有度'],['quantity','數量'],['createdAt','建立時間'],['updatedAt','修改時間']];
function buildFilters(){
  const box=$('sfil');box.innerHTML='';F.q='';const A=allCards();
  const sel=(lab,opts,cur,fn)=>{const s=document.createElement('select');s.className='sel8';s.append(new Option(lab+':全部',''));opts.forEach(o=>s.append(new Option(o[1],o[0])));s.value=opts.some(o=>o[0]===cur)?cur:'';s.onchange=()=>{fn(s.value);renderSearch()};box.append(s);return s};
  [['set','系列'],['rarity','稀有度'],['language','語言'],['variant','版本'],['condition','品相']].forEach(([k,l])=>{
    const vals=[...new Set(A.map(x=>x.m[k]).filter(Boolean))].sort();const s=sel(l,vals.map(v=>[v,v]),F[k],v=>{F[k]=v});F[k]=s.value});
  const s2=sel('狀態',ST.map(x=>[x,x]),F.status,v=>{F.status=v});F.status=s2.value;
  const so=document.createElement('select');so.className='sel8';SORTS.forEach(o=>so.append(new Option('排序:'+o[1],o[0])));so.value=F.sort;so.onchange=()=>{F.sort=so.value;renderSearch()};box.append(so);
  const db=document.createElement('button');db.className='sel8';db.textContent=F.dir>0?'↑ 升序':'↓ 降序';db.onclick=()=>{F.dir*=-1;db.textContent=F.dir>0?'↑ 升序':'↓ 降序';renderSearch()};box.append(db);
  [['fav','⭐ 最愛'],['dup','🔁 重複卡']].forEach(([k,l])=>{const lb=document.createElement('label'),i=document.createElement('input');i.type='checkbox';i.checked=F[k];i.onchange=()=>{F[k]=i.checked;renderSearch()};lb.append(i,' '+l);box.append(lb)});
}
function renderSearch(){
  const box=$('searchResults');box.innerHTML='';const key=F.q.trim().toLowerCase();
  let arr=allCards().filter(x=>{const m=x.m;
    if(key&&![m.name,m.number,m.set,m.rarity,m.language,m.variant,m.tags,m.note].join(' ').toLowerCase().includes(key))return false;
    for(const k of['set','rarity','language','variant','condition'])if(F[k]&&m[k]!==F[k])return false;
    if(F.status&&!(m.status||[]).includes(F.status))return false;
    if(F.fav&&!m.favorite)return false;if(F.dup&&!isDup(m))return false;return true});
  const sk=F.sort,num=sk==='quantity'||sk==='createdAt'||sk==='updatedAt';
  arr.sort((a,b)=>F.dir*(num?(a.m[sk]||0)-(b.m[sk]||0):String(a.m[sk]||'').localeCompare(String(b.m[sk]||''),'zh-Hant',{numeric:true})));
  if(!arr.length){const d=document.createElement('div');d.style.cssText='grid-column:1/-1;text-align:center;opacity:.7;padding:24px';d.textContent='找不到符合條件的卡片';box.append(d);return}
  const tot=arr.length;arr=arr.slice(0,120);
  arr.forEach(x=>{const b=document.createElement('button');b.className='sr';const im=new Image();im.loading='lazy';im.decoding='async';im.src=x.u;b.append(im);const m=x.m;
    [[m.name||'未命名卡片',0],[(SH.books[x.bi].cfg.title||'卡冊')+'・第 '+(x.pi+1)+' 頁・×'+m.quantity,.65],[[m.rarity].concat(m.favorite?['⭐']:[],m.status.filter(t=>t!=='最愛')).filter(Boolean).join('・'),.65]].forEach(([t,o])=>{const sm=document.createElement('small');sm.textContent=t;if(o)sm.style.opacity=o;b.append(sm)});
    b.onclick=()=>{switchBook(x.bi);S.cur=x.pi;render();$('searchPanel').classList.remove('on');setTimeout(()=>openCardEditor(x.u),250)};box.append(b)});
  if(tot>arr.length){const d=document.createElement('div');d.style.cssText='grid-column:1/-1;text-align:center;opacity:.7;font-size:12px';d.textContent='共 '+tot+' 張,僅顯示前 '+arr.length+' 張,請縮小條件';box.append(d)}
}
/* dashboard + shelf */
let shSort='def';
function bookInfo(bi,A){const b=SH.books[bi],xs=A.filter(x=>x.bi===bi),u=xs.filter(x=>x.m.quantity>0).length;return{n:xs.length,own:xs.reduce((a,x)=>a+x.m.quantity,0),pages:b.pages.length,u,pct:b.cfg.total>0?Math.min(100,Math.round(u/b.cfg.total*100)):null}}
function renderDash(A){
  const box=$('dash');box.innerHTML='';const hs=(m,x)=>(m.status||[]).includes(x),n=f=>A.filter(x=>f(x.m)).length;
  let tu=0,ttl=0;SH.books.forEach((b,i)=>{if(b.cfg.total>0){ttl+=b.cfg.total;tu+=Math.min(b.cfg.total,A.filter(x=>x.bi===i&&x.m.quantity>0).length)}});
  const items=[['卡片種類',A.length],['持有張數',A.reduce((a,x)=>a+x.m.quantity,0)],['卡冊',SH.books.length],['頁面',SH.books.reduce((a,b)=>a+b.pages.length,0)],['⭐ 最愛',n(m=>m.favorite)],['🔁 重複',n(isDup)],['📦 待整理',n(m=>hs(m,'待整理'))],['🔍 待鑑定',n(m=>hs(m,'待鑑定'))]];
  const g=document.createElement('div');g.className='dg';
  items.forEach(([k,v])=>{const d=document.createElement('div'),b=document.createElement('b'),s=document.createElement('span');b.textContent=v.toLocaleString();s.textContent=k;d.append(b,s);g.append(d)});box.append(g);
  if(ttl>0){const p=Math.round(tu/ttl*100),l=document.createElement('div');l.style.fontSize='12px';l.textContent='收藏完成度 '+p+'%('+tu+' / '+ttl+')';const bar=document.createElement('div');bar.className='bar';const i=document.createElement('i');i.style.width=p+'%';bar.append(i);box.append(l,bar)}
  [['set','系列',1],['rarity','稀有度',0],['language','語言',0]].forEach(([k,lab,isSet])=>{
    const mp=new Map();A.forEach(x=>{const v=x.m[k]||'未填';mp.set(v,(mp.get(v)||0)+1)});if(!mp.size)return;
    const row=document.createElement('div');row.className='tl';const b=document.createElement('b');b.textContent=lab;row.append(b);
    [...mp].sort((a,c)=>c[1]-a[1]).slice(0,12).forEach(([v,c])=>{const sp=document.createElement('span');sp.textContent=isSet?v+'・已收藏 '+c+' 張':v+' '+c;row.append(sp)});box.append(row)});
  if(!A.length){const d=document.createElement('div');d.style.cssText='text-align:center;opacity:.75;padding:12px';d.textContent='尚未加入卡片,點任一空格開始加入收藏';box.append(d)}
}
function buildShelf(){
  const box=$('shbox');box.innerHTML='';$('shn').textContent='我的書櫃('+SH.books.length+' / 10)';$('shsel').value=shSort;
  const A=allCards();renderDash(A);const info=SH.books.map((b,i)=>bookInfo(i,A)),order=SH.books.map((b,i)=>i);
  const ks={name:(a,b)=>(SH.books[a].cfg.title||'').localeCompare(SH.books[b].cfg.title||'','zh-Hant'),count:(a,b)=>info[b].n-info[a].n,pct:(a,b)=>(info[b].pct||0)-(info[a].pct||0),def:(a,b)=>a-b};
  order.sort(ks[shSort]||ks.def);
  order.forEach(i=>{const b=SH.books[i],f=info[i],t=document.createElement('button');t.className='tile'+(i===SH.act?' sel':'');
    const w=document.createElement('div');w.className='cvw';w.append(coverEl(b,true));t.append(w);
    const sm=document.createElement('small');sm.style.cssText='display:block;font-size:11px;opacity:.8;margin-top:3px;color:#e6edf5';sm.textContent=f.n+' 種・'+f.own+' 張・'+f.pages+' 頁'+(f.pct!=null?'・'+f.pct+'%':'');t.append(sm);
    t.onclick=()=>switchBook(i);t.title=(b.cfg.title||'書本');box.append(t)});
  if(SH.books.length<10){const t=document.createElement('button');t.className='tile new';t.textContent='＋ 新增書本';
    t.onclick=()=>{const b=newBook('書本 '+(SH.books.length+1));SH.books.push(b);switchBook(SH.books.length-1);buildSet();$('set').classList.add('on')};box.append(t)}
}
$('shsel').onchange=e=>{shSort=e.target.value;buildShelf()};
/* ===== /V8 ===== */
mq.addEventListener&&mq.addEventListener('change',()=>{if(!busy)render()});
addEventListener('resize',()=>{if(S)fit()});
(async()=>{
  let lf=false;try{await loadAll()}catch(e){lf=true;toast('資料讀取失敗,為保護現有資料,本次不會寫入儲存');$('saveStatus').textContent='未保存'}
  if(!SH)SH={books:[normBook({})],act:0};
  S=SH.books[SH.act];ready=!lf;applyCfg();render();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
})();
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')}catch(e){}
</script>
